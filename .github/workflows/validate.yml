name: Validate repository

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository and Luau compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository assets and documentation
        run: python scripts/check_repository.py
      - name: Verify generated preset catalog
        run: python scripts/generate_presets.py --check
      - name: Install pinned Luau compiler
        shell: bash
        run: |
          mkdir -p .tools/luau
          curl --fail --location --retry 3 --output .tools/luau.zip https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip
          echo "152058b98c60ff1f5b5ec9bca0b8eb37793cae161dd3a05608cc3d8738ba1a4d  .tools/luau.zip" | sha256sum --check
          unzip -q .tools/luau.zip -d .tools/luau
          chmod +x .tools/luau/luau-compile .tools/luau/luau
      - name: Compile shared engine, adapter, and presets without executing Roblox code
        run: .tools/luau/luau-compile --null StreamingCapture.luau saveinstance.luau "Script Presets/"*.luau Executors/Potassium/saveinstance.luau "Executors/Potassium/Script Presets/"*.luau
      - name: Exercise preset preflight and output evidence with a mocked engine
        run: python scripts/test_presets.py --luau .tools/luau/luau
      - name: Check actual property-reader regressions
        run: python scripts/test_property_reads.py --luau .tools/luau/luau
      - name: Check collection beneath excluded module containers
        run: python scripts/test_collection.py --luau .tools/luau/luau
      - name: Check modern mesh Content metadata selection
        run: python scripts/test_content_metadata.py --luau .tools/luau/luau
      - name: Check GPS grid, streaming lifecycle, and retained export hierarchy
        run: python scripts/test_gps.py --luau .tools/luau/luau
      - name: Check Potassium adapter contracts
        run: python scripts/test_potassium.py --luau .tools/luau/luau
      - name: Check export deadlines, bytecode memoization, and chunk fallbacks
        run: python scripts/test_export_jobs.py --luau .tools/luau/luau
      - name: Check progress display, frame budget, and writer counters
        run: python scripts/test_progress_ui.py --luau .tools/luau/luau
      - name: Check binary encoder bytes across cooperative yields
        run: python scripts/test_binary_scheduling.py --luau .tools/luau/luau
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
